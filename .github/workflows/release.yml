# Builds a universal Edgewise.zip and attaches it to a GitHub release.
# Runs only for version tags (git tag v1.2.3 && git push --tags) or by hand,
# so ordinary pushes don't use macOS runner minutes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: make test

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="$(cat VERSION)"
          VERSION="$VERSION" make zip
          echo "ZIP=build/Edgewise-$(cat VERSION).zip" >> "$GITHUB_ENV"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Edgewise-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/Edgewise-*.zip \
              --title "Edgewise ${GITHUB_REF_NAME#v}" \
              --notes-file CHANGELOG.md
          fi

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Edgewise
          path: build/Edgewise-*.zip
